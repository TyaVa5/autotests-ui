[pytest]
addopts = -s -v
python_files = *_tests.py test_*.py
python_classes = Test*
python_functions = test_*

markers =
    registration: Запускает все тесты регистрации
    regression: для регрессионных тестов.
    authorization: Запускает тесты авторизации
    courses: для тестов, связанных с курсами.
    dashboard: Маркировка для тестов, связанных с рабочей панелью.

